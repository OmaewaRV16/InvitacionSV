<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abriendo WhatsApp...</title>
</head>

<body>

<script>
  const telefono = "5219993547812";

  const saludo = String.fromCodePoint(0x1F44B);   // 👋
  const emocion = String.fromCodePoint(0x1F929);  // 🤩

  const mensaje =
    "Hola " + saludo +
    " me interesa mucho conocer la cuponera y todos los beneficios que tiene " +
    emocion +
    " ¿Me comparten la información para saber cómo puedo obtenerla?";

  const url =
    "https://api.whatsapp.com/send?phone=" +
    telefono +
    "&text=" +
    encodeURIComponent(mensaje);

  window.location.replace(url);
</script>

</body>
</html>
